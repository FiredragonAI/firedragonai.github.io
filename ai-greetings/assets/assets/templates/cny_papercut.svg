    <rect x="-118" y="-118" width="236" height="236" rx="6" fill="none" stroke="#F2C94C" stroke-opacity="0.55" stroke-width="3"/>
    <rect x="-40" y="-40" width="80" height="80" fill="#F2C94C"/>
  </g>
  <!-- 梅花 -->
  <g fill="#F2C94C" fill-opacity="0.85">
    <g transform="translate(120 1120)">
      <circle cx="0" cy="-22" r="14"/><circle cx="21" cy="-7" r="14"/><circle cx="13" cy="18" r="14"/><circle cx="-13" cy="18" r="14"/><circle cx="-21" cy="-7" r="14"/><circle cx="0" cy="0" r="6" fill="#8E1A12"/>
    </g>
    <g transform="translate(200 1200) scale(0.7)">
