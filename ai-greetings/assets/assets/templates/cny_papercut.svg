      <stop offset="0" stop-color="#8E1A12"/>
      <stop offset="1" stop-color="#5A0C08"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <!-- 右上:菱形窗花 -->
