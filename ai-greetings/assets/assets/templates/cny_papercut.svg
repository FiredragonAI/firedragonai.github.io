    </g>
    <g transform="translate(70 1230) scale(0.5)">
      <circle cx="0" cy="-22" r="14"/><circle cx="21" cy="-7" r="14"/><circle cx="13" cy="18" r="14"/><circle cx="-13" cy="18" r="14"/><circle cx="-21" cy="-7" r="14"/><circle cx="0" cy="0" r="6" fill="#8E1A12"/>
    </g>
