  <rect x="40" y="40" width="1000" height="1270" fill="none" stroke="#F2C94C" stroke-width="3"/>
  <rect x="56" y="56" width="968" height="1238" fill="none" stroke="#F2C94C" stroke-opacity="0.5" stroke-width="1.5"/>
