    <rect x="930" y="160" width="20" height="10" rx="3"/><rect x="1010" y="296" width="20" height="10" rx="3"/>
  </g>
  <!-- 汤圆 -->
  <g transform="translate(150 1180)">
    <ellipse cx="0" cy="40" rx="150" ry="24" fill="#F2C94C" fill-opacity="0.15"/>
    <circle cx="-50" cy="0" r="38" fill="#FFF6E5"/><circle cx="20" cy="-10" r="42" fill="#FFF6E5"/><circle cx="80" cy="6" r="36" fill="#FFF6E5"/>
