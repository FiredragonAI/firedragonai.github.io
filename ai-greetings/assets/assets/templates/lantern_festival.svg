  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <!-- 一排圆灯笼,不同高度 -->
  <g stroke="#F2C94C" stroke-width="3">
    <line x1="700" y1="0" x2="700" y2="90"/><line x1="820" y1="0" x2="820" y2="150"/><line x1="940" y1="0" x2="940" y2="60"/><line x1="1020" y1="0" x2="1020" y2="200"/>
  </g>
  <circle cx="700" cy="150" r="130" fill="url(#g1)"/>
  <circle cx="700" cy="150" r="60" fill="#FF7A45"/>
  <circle cx="700" cy="150" r="60" fill="none" stroke="#F2C94C" stroke-opacity="0.6" stroke-width="3"/>
  <circle cx="820" cy="210" r="110" fill="url(#g1)"/>
  <circle cx="820" cy="210" r="50" fill="#E6402E"/>
  <circle cx="940" cy="120" r="100" fill="url(#g1)"/>
  <circle cx="940" cy="120" r="44" fill="#FFB347"/>
  <circle cx="1020" cy="260" r="90" fill="url(#g1)"/>
  <circle cx="1020" cy="260" r="40" fill="#FF7A45"/>
  <g fill="#F2C94C">
