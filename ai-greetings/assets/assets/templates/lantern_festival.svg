      <stop offset="0" stop-color="#3B0F2E"/>
      <stop offset="1" stop-color="#1B0716"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB347" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFB347" stop-opacity="0"/>
